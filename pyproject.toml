[project]
name = "jatb"
version = "0.1.0"
description = "Just Another Trackmania Bot - a project for Game Botting UWr Class"
authors = [
    {name = "Jakub Iliński"},
    {name = "Jan Mączyński"},
    {name = "Stanisław Burdzicki"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy (<2.5)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "tqdm (>=4.70.1,<5.0.0)"
]

[project.scripts]
jatb = "jatb.__main__:main"
record = "scripts.record:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "jatb" },
    { include = "scripts" }
]
